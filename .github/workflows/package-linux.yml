name: Package Linux preview

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: package-linux-release
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'CateDesu/Nyastra-Mod-Manager' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Install Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-setuptools cmake liblz4-dev libfontconfig1-dev patchelf xdg-utils desktop-file-utils psmisc xvfb
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit runtime dependencies
        run: node scripts/audit-runtime.mjs
      - name: Verify archive runtime and AppImage launcher
        run: node --test scripts/archive-runtime.test.mjs scripts/appimage-launcher.test.mjs scripts/smoke-linux.test.mjs
      - run: pnpm run verify
        env:
          NX_STREAM_OUTPUT: "true"
      - name: Prepare Linux runtime
        run: pnpm nx run @vortex/main:publish
        env:
          NODE_ENV: production
          VORTEX_ELECTRON_REBUILD: skip
      - name: Rebuild deployed native modules
        run: node src/main/dist/postinstall.mjs
      - name: Package ZIP, AppImage and Debian preview
        run: pnpm --filter @vortex/main run package:nosign --x64
      - run: node scripts/verify-packaged-asar.mjs
      - name: Prepare Electron sandbox on this disposable runner
        run: sudo chown root:root dist/linux-unpacked/chrome-sandbox && sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
      - name: Check packaged startup
        run: xvfb-run -a node scripts/smoke-linux.mjs dist/linux-unpacked/nyastra-mod-manager
      - name: Check packaged AppImage startup
        run: |
          version=$(node -p 'require("./src/main/package.json").version')
          title=$(node scripts/releases/release-title.mjs "$version")
          image="$GITHUB_WORKSPACE/dist/nyastra-${title#v}-linux-x64.AppImage"
          appimage_preview=$(mktemp -d)
          trap 'rm -rf "$appimage_preview"' EXIT
          (cd "$appimage_preview" && "$image" --appimage-extract >/dev/null)
          sudo chown root:root "$appimage_preview/squashfs-root/chrome-sandbox"
          sudo chmod 4755 "$appimage_preview/squashfs-root/chrome-sandbox"
          APPDIR="$appimage_preview/squashfs-root" xvfb-run -a node scripts/smoke-linux.mjs "$appimage_preview/squashfs-root/AppRun"
      - run: node scripts/releases/stage-linux-release.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: nyastra-linux-preview
          path: dist/release/
          if-no-files-found: error
      - name: Publish Linux preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p 'require("./src/main/package.json").version')
          title=$(node scripts/releases/release-title.mjs "$version")
          release_version="${title#v}"
          tag="v$version"
          source="https://github.com/$GH_REPO/tree/$tag"
          grep -Fxq "$source" dist/release/notes.md
          grep -Fxq "Source: $source" dist/release/README.txt
          for extension in zip AppImage deb; do
            test -s "dist/release/assets/nyastra-$release_version-linux-x64.$extension"
          done
          test -s "dist/release/assets/nyastra-$version-linux-x64.zip"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo "::error::This version is already published. Increment src/main/package.json."
              exit 1
            fi
          fi
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            test "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
          if [ "$draft" != true ]; then
            gh release create "$tag" --verify-tag --draft \
              --title "$title" --notes-file dist/release/notes.md
          fi
          gh release upload "$tag" dist/release/assets/* --clobber
          gh release edit "$tag" --draft=false --prerelease=false --latest
      - name: Clean superseded builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run cleanup-builds.yml --ref main
