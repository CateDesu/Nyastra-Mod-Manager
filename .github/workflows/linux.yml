name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Install Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-setuptools cmake liblz4-dev libfontconfig1-dev libglib2.0-bin patchelf xdg-utils desktop-file-utils psmisc
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit runtime dependencies
        run: node scripts/audit-runtime.mjs
      - name: Verify archive runtime and AppImage launcher
        run: node --test scripts/archive-runtime.test.mjs scripts/appimage-launcher.test.mjs
      - run: pnpm run verify
        env:
          NX_STREAM_OUTPUT: "true"
      - name: Test Linux installation and profile import
        run: node --test scripts/install-linux.test.mjs scripts/import-linux-profile.test.mjs
